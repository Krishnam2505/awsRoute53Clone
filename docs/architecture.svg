<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#414d5c"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f141a">Route 53 console clone — architecture</text>

  <!-- Browser -->
  <rect x="24" y="90" width="190" height="200" rx="10" fill="#f4f4f4" stroke="#8c8c94"/>
  <text x="119" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#0f141a">Browser</text>
  <text x="119" y="148" text-anchor="middle" font-size="13" fill="#414d5c">Cloudscape UI</text>
  <text x="119" y="168" text-anchor="middle" font-size="13" fill="#414d5c">TanStack Query cache</text>
  <text x="119" y="188" text-anchor="middle" font-size="13" fill="#414d5c">Typed API client</text>
  <text x="119" y="222" text-anchor="middle" font-size="12" fill="#656871">Talks only to the</text>
  <text x="119" y="240" text-anchor="middle" font-size="12" fill="#656871">Next.js domain</text>
  <text x="119" y="268" text-anchor="middle" font-size="12" fill="#656871">HttpOnly session cookie</text>

  <!-- Next.js -->
  <rect x="258" y="70" width="254" height="240" rx="10" fill="#f2f8fd" stroke="#006ce0"/>
  <text x="385" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f141a">Next.js (Vercel)</text>
  <rect x="274" y="114" width="222" height="40" rx="6" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="385" y="139" text-anchor="middle" font-size="12" fill="#0f141a">middleware.ts: no cookie → /login</text>
  <rect x="274" y="164" width="222" height="40" rx="6" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="385" y="189" text-anchor="middle" font-size="13" fill="#0f141a">/route53/v2/* pages</text>
  <rect x="274" y="214" width="222" height="40" rx="6" fill="#ffffff" stroke="#9ec5f0"/>
  <text x="385" y="239" text-anchor="middle" font-size="12" fill="#0f141a">rewrite /api/* → BACKEND_URL</text>
  <text x="385" y="290" text-anchor="middle" font-size="12" fill="#656871">cookie stays first-party, no CORS</text>

  <!-- FastAPI -->
  <rect x="556" y="70" width="230" height="240" rx="10" fill="#f2fcf3" stroke="#00802f"/>
  <text x="671" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#0f141a">FastAPI (Docker)</text>
  <rect x="576" y="114" width="190" height="34" rx="6" fill="#ffffff" stroke="#a5d6b0"/>
  <text x="671" y="136" text-anchor="middle" font-size="13" fill="#0f141a">api/routes (thin)</text>
  <rect x="576" y="156" width="190" height="34" rx="6" fill="#ffffff" stroke="#a5d6b0"/>
  <text x="671" y="178" text-anchor="middle" font-size="13" fill="#0f141a">services + validators</text>
  <rect x="576" y="198" width="190" height="34" rx="6" fill="#ffffff" stroke="#a5d6b0"/>
  <text x="671" y="220" text-anchor="middle" font-size="13" fill="#0f141a">SQLAlchemy 2.0 models</text>
  <rect x="576" y="240" width="190" height="34" rx="6" fill="#ffffff" stroke="#a5d6b0"/>
  <text x="671" y="262" text-anchor="middle" font-size="13" fill="#0f141a">Alembic migrations</text>
  <text x="671" y="296" text-anchor="middle" font-size="12" fill="#656871">/api/v1, one error format</text>

  <!-- SQLite -->
  <rect x="830" y="130" width="110" height="120" rx="10" fill="#fffaf0" stroke="#c45500"/>
  <text x="885" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#0f141a">SQLite</text>
  <text x="885" y="192" text-anchor="middle" font-size="12" fill="#656871">route53.db</text>
  <text x="885" y="212" text-anchor="middle" font-size="12" fill="#656871">on a volume</text>
  <text x="885" y="230" text-anchor="middle" font-size="12" fill="#656871">at /data</text>

  <!-- arrows -->
  <line x1="214" y1="190" x2="256" y2="190" stroke="#414d5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="180" text-anchor="middle" font-size="11" fill="#414d5c">HTTPS</text>
  <line x1="512" y1="234" x2="554" y2="160" stroke="#414d5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="212" text-anchor="middle" font-size="11" fill="#414d5c">/api/*</text>
  <line x1="786" y1="215" x2="828" y2="200" stroke="#414d5c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- build-time type generation -->
  <path d="M671 312 C 671 380, 385 380, 385 312" fill="none" stroke="#7d8998" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="528" y="396" text-anchor="middle" font-size="12" fill="#414d5c">build time: /openapi.json → openapi-typescript → src/lib/api-types.ts</text>
</svg>
